services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      CUDA_VISIBLE_DEVICES: "-1"
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  model-pull:
    image: ollama/ollama:latest
    profiles: ["setup"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "${LOCAL_AGENT_MODEL:-qwen2.5-coder:14b}"]

  agent:
    build: .
    image: local-agentic-ai:latest
    profiles: ["agent"]
    environment:
      OLLAMA_URL: http://ollama:11434
      LOCAL_AGENT_MODEL: ${LOCAL_AGENT_MODEL:-qwen2.5-coder:14b}
      LOCAL_AGENT_WORKSPACE: /workspace
      LOCAL_AGENT_TRUST: ask
      LOCAL_AGENT_NUM_CTX: "4096"
    volumes:
      - .:/workspace
    depends_on:
      ollama:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  ollama-data:
    name: ${OLLAMA_DATA_VOLUME:-local-agentic-ai-ollama-data}
    external: ${OLLAMA_DATA_VOLUME_EXTERNAL:-false}
